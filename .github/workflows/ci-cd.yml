name: Python Docker CI/CD   #This defines the name of your workflow.

on:                         #Defines the event that triggers the workflow
  push:                     #The event is a Git push.  
    branches:               #Specifies which branch to monitor.
      - main                #Only pushes to the main branch trigger this workflow.

jobs:                       #jobs is used to define the jobs inside your workflow.

  build-and-test:

    runs-on: ubuntu-latest  #Where will the job execute

    steps:                  #defines the individual tasks that the job should perform.

    - name: Checkout Code     #code is in git hub repo, runner is dufferent machine It downloads/checks out your repository code into the runner's working directory.
      uses: actions/checkout@v5   

    - name: Setup Python
      uses: actions/setup-python@v6   #need Python to execute our application and tests.configure python 3.11
      with:
        python-version: '3.11'

    - name: Install Dependencies  #Pinstalls all the Python packages mentioned in the requirements file.nal libraries.
      run: |
        pip install -r requirements.txt

    - name: Run Tests          #need to verify whether our application is working correctly.se pytest to execute automated test cases.
      run: |
        pytest

    - name: Login to DockerHub     #moving from Python testing to Docker image publishing.
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}     #passes the login credentials to the Docker login action.
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image   #Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/python-cicd-demo:latest .

    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/python-cicd-demo:latest